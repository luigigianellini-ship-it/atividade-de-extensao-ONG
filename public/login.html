<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrativo | Instituto Sementes do Amanhã</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/assets/css/custom.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-emerald-950 min-h-screen flex items-center justify-center p-4 antialiased text-slate-800">

  <!-- Toast de Notificação (pointer-events: none para nunca cobrir o formulário) -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none" style="pointer-events: none !important; bottom: auto !important;"></div>

  <div class="max-w-md w-full bg-white rounded-3xl p-8 sm:p-10 shadow-2xl border border-slate-100/10 relative z-10">
    
    <!-- Ícone e Cabeçalho -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-emerald-100 text-emerald-700 mx-auto flex items-center justify-center font-bold mb-4 shadow-sm">
        <i data-lucide="shield-check" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-black text-slate-900 font-heading">Painel de Gestão</h1>
      <p class="text-xs text-slate-500 mt-1">Acesso restrito para administradores da organização</p>
    </div>

    <!-- Formulário de Login (Otimizado para Mobile e Desktop) -->
    <form id="form-login" class="space-y-5" autocomplete="off">
      <div>
        <label for="login-username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5 cursor-pointer select-none">Usuário</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 z-20">
            <i data-lucide="user" class="w-4 h-4"></i>
          </div>
          <input type="text" id="login-username" required placeholder="Digite seu usuário" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 text-base focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50 focus:bg-white transition cursor-text relative z-10" style="touch-action: manipulation; -webkit-user-select: text; user-select: text;">
        </div>
      </div>

      <div>
        <label for="login-password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5 cursor-pointer select-none">Senha de Acesso</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 z-20">
            <i data-lucide="lock" class="w-4 h-4"></i>
          </div>
          <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" class="w-full pl-10 pr-11 py-3 rounded-xl border border-slate-200 text-base focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50 focus:bg-white transition cursor-text relative z-10" style="touch-action: manipulation; -webkit-user-select: text; user-select: text;">
          <button type="button" id="btn-toggle-senha" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition z-20" aria-label="Mostrar ou ocultar senha">
            <i data-lucide="eye" id="icone-eye" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="btn-submit" class="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm uppercase tracking-wider shadow-lg shadow-emerald-600/30 transition hover-lift flex items-center justify-center gap-2">
        <i data-lucide="log-in" class="w-4 h-4"></i> Entrar no Painel
      </button>
    </form>

    <!-- Informativo de segurança -->
    <div class="mt-6 p-3 rounded-xl bg-slate-50 border border-slate-200 text-center text-xs text-slate-500 flex items-center justify-center gap-1.5">
      <i data-lucide="shield" class="w-4 h-4 text-emerald-600"></i>
      <span>Ambiente protegido por criptografia e sessão autenticada.</span>
    </div>

    <!-- Voltar ao Site -->
    <div class="mt-6 text-center">
      <a href="/" class="text-xs font-bold text-slate-500 hover:text-emerald-600 inline-flex items-center gap-1.5 transition">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Voltar para a Página Inicial
      </a>
    </div>

  </div>

  <script>
    if (window.lucide) lucide.createIcons();

    // Toggle de visibilidade da senha
    const btnToggle = document.getElementById("btn-toggle-senha");
    const inputPass = document.getElementById("login-password");
    const iconeEye = document.getElementById("icone-eye");
    if (btnToggle && inputPass) {
      btnToggle.addEventListener("click", () => {
        const isPassword = inputPass.type === "password";
        inputPass.type = isPassword ? "text" : "password";
        iconeEye.setAttribute("data-lucide", isPassword ? "eye-off" : "eye");
        if (window.lucide) lucide.createIcons();
      });
    }

    // Toast de aviso
    function showToast(mensagem, tipo = "sucesso") {
      const container = document.getElementById("toast-container");
      if (!container) return;
      const toast = document.createElement("div");
      const bgCor = tipo === "sucesso" ? "bg-emerald-600 text-white" : "bg-red-600 text-white";
      toast.className = `flex items-center gap-3 p-4 rounded-xl shadow-xl ${bgCor} text-sm font-medium transition-all duration-300 pointer-events-auto`;
      toast.style.pointerEvents = "auto";
      toast.innerHTML = `<div class="flex-1">${mensagem}</div>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // Formulário de Login
    const formLogin = document.getElementById("form-login");
    if (formLogin) {
      formLogin.addEventListener("submit", async (e) => {
        e.preventDefault();
        const btnSubmit = document.getElementById("btn-submit");
        const txtOriginal = btnSubmit.innerHTML;
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = "Verificando credenciais...";

        const username = document.getElementById("login-username").value.trim();
        const password = document.getElementById("login-password").value;

        try {
          const res = await fetch("/api/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();

          if (data.sucesso) {
            if (data.token) {
              sessionStorage.setItem("admin_token", data.token);
              sessionStorage.setItem("admin_user", data.username || username);
              localStorage.setItem("admin_token", data.token);
              localStorage.setItem("admin_user", data.username || username);
            }
            showToast("Login autorizado! Redirecionando...", "sucesso");
            setTimeout(() => {
              window.location.href = `/admin?token=${encodeURIComponent(data.token)}`;
            }, 600);
          } else {
            showToast(data.erro || "Usuário ou senha incorretos.", "erro");
            document.getElementById("login-password").value = "";
            document.getElementById("login-password").focus();
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = txtOriginal;
            if (window.lucide) lucide.createIcons();
          }
        } catch (err) {
          showToast("Erro ao conectar com o servidor.", "erro");
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = txtOriginal;
          if (window.lucide) lucide.createIcons();
        }
      });
    }

    // Garante que os campos de login venham vazios ao abrir a página
    window.addEventListener("DOMContentLoaded", () => {
      const u = document.getElementById("login-username");
      const p = document.getElementById("login-password");
      if (u) u.value = "";
      if (p) p.value = "";
    });
  </script>
</body>
</html>
